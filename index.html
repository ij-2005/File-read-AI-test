<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI File Reader Test</title>
  <script src="frontEnd.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      margin-top: 0;
      color: gray;
      font-weight: normal;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .response-box {
      margin-top: 20px;
      padding: 15px;
      min-height: 100px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fafafa;
      white-space: pre-wrap;
    }

    .quiz-section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
      display: none; /* hidden until file is uploaded */
      text-align: left;
    }

    .quiz-question {
      margin-bottom: 20px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI File Reader Test</h1>
    <h3>By ij2005</h3>

    <input type="file" id="fileInput" accept=".pdf">
    <br>
    <button onclick="handleFile()">Upload & Process</button>

    <div id="response" class="response-box">
      <!-- Gemini response will appear here -->
    </div>

    <div id="quizSection" class="quiz-section">
      <h2>Generated Quiz</h2>
      <div id="quizContainer"></div>
      <button onclick="submitQuiz()">Submit Quiz</button>
      <div id="quizResult" style="margin-top:15px; font-weight:bold;"></div>
    </div>
  </div>

</body>
</html>
