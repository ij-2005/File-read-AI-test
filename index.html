<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI File Reader Test</title>
  <script src="frontEnd.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    h3 {
      margin-top: 0;
      color: gray;
      font-weight: normal;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
    }

    .response-box {
      margin-top: 20px;
      padding: 15px;
      min-height: 150px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fafafa;
      white-space: pre-wrap;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI File Reader Test</h1>
    <h3>By ij2005</h3>

    <input type="file" id="fileInput" accept=".pdf">
    <br>
    <button onclick="handleFile()">Upload & Process</button>

    <div id="response" class="response-box">
      <!-- Gemini response will appear here -->
    </div>
  </div>


</body>
</html>
