<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI File Reader Test</title>
  <link rel="stylesheet" href="styling.css">
  <script src="frontEnd.js"></script>
</head>
<body>

  <div class="container">
    <h1>AI File Reader Test</h1>
    <h3>By ij2005 pogi</h3>

    <!-- Question count segmented control -->
<div class="question-count" role="group" aria-label="Number of Questions">
  <div class="segmented" role="radiogroup" aria-label="Number of Questions">
    <button type="button" class="segmented-item" data-value="5" aria-pressed="true">5</button>
    <button type="button" class="segmented-item" data-value="10" aria-pressed="false">10</button>
  </div>
  <input type="hidden" id="questionCount" value="5">
</div>

<!-- Difficulty segmented control -->
<div class="difficulty-choice" role="group" aria-label="Difficulty">
  <div class="segmented" role="radiogroup" aria-label="Difficulty">
    <button type="button" class="segmented-item" data-value="easy" aria-pressed="true">Easy</button>
    <button type="button" class="segmented-item" data-value="medium" aria-pressed="false">Medium</button>
    <button type="button" class="segmented-item" data-value="hard" aria-pressed="false">Hard</button>
  </div>
  <input type="hidden" id="difficulty" value="easy">
</div>
  <br>

    <div class="file-upload">
    <input type="file" id="fileInput" accept=".pdf">
    <label for="fileInput">Choose File</label>
    <div class="file-name" id="fileName">No file chosen</div>
  </div>
    <br>
    <button onclick="handleFile()">Upload & Process</button>

    <div id="response" class="response-box">
      <!-- Gemini response will appear here -->
    </div>

    <div id="quizSection" class="quiz-section">
      <h2>Generated Quiz</h2>
      <div id="quizContainer"></div>
      <button onclick="submitQuiz()">Submit Quiz</button>
      <div id="quizResult" style="margin-top:15px; font-weight:bold;"></div>
    </div>
  </div>

  <script>
  (function () {
    // Attach behavior to all segmented controls
    document.querySelectorAll('.segmented').forEach(function(group){
      group.addEventListener('click', function(e){
        const btn = e.target.closest('.segmented-item');
        if (!btn) return;
        // mark all siblings as unpressed
        group.querySelectorAll('.segmented-item').forEach(function(s){
          s.setAttribute('aria-pressed', 'false');
        });
        // set clicked as pressed
        btn.setAttribute('aria-pressed', 'true');
        // update the hidden input in the same parent container
        const parent = group.parentElement;
        const hidden = parent.querySelector('input[type="hidden"]');
        if (hidden) hidden.value = btn.getAttribute('data-value');
      });

    });
  })();
</script>
<script>
  
document.getElementById("fileInput").addEventListener("change", function(){
  const fileName = this.files.length ? this.files[0].name : "No file chosen";
  document.getElementById("fileName").textContent = `Current file using: ${fileName}`;
});


</script>

</body>
</html>
